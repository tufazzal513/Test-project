name: Build Telegram Local Bot API (Linux x86_64)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-local-api.yml"

permissions:
  contents: read

jobs:
  build-local-api:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake g++ make zlib1g-dev libssl-dev gperf

      # The official telegram-bot-api repository contains TDLib as a git submodule.
      # --recurse-submodules is required; cloning without it leaves td/ empty.
      - name: Clone Telegram Bot API with TDLib submodule
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/tdlib/telegram-bot-api.git telegram-bot-api
          test -f telegram-bot-api/td/CMakeLists.txt

      - name: Configure and build official Telegram Bot API
        run: |
          cmake -S telegram-bot-api -B telegram-bot-api/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/telegram-bot-api/install"
          cmake --build telegram-bot-api/build --target install -j2

      - name: Package executable
        run: |
          set -euo pipefail
          mkdir -p release
          BIN="$(find telegram-bot-api/install -type f -name telegram-bot-api -perm -u+x -print -quit)"
          if [ -z "$BIN" ]; then
            BIN="$(find telegram-bot-api/build -type f -name telegram-bot-api -perm -u+x -print -quit)"
          fi
          test -n "$BIN"
          cp "$BIN" release/telegram-bot-api
          chmod +x release/telegram-bot-api
          file release/telegram-bot-api
          ldd release/telegram-bot-api || true
          tar -czf telegram-bot-api-linux-x86_64.tar.gz -C release telegram-bot-api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-linux-x86_64
          path: telegram-bot-api-linux-x86_64.tar.gz
          if-no-files-found: error
