name: Build Linux binaries
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/rust-video-converter-bot release/
          cp README.md .env.example Dockerfile release/
          tar -czf rust-video-converter-linux-x86_64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: rust-video-converter-linux-x86_64
          path: rust-video-converter-linux-x86_64.tar.gz
      - name: Attach release asset for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rust-video-converter-linux-x86_64.tar.gz
